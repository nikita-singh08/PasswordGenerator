<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1>Password Generator</h1>

        <div class="display-container">

            <input readonly placeholder="PASSWORD" class="display" data-passwordDisplay>

            <button class="copy-btn" data-copy>
                 <span class="tooltip"data-copyMsg></span> 
                <img src="copy.png" alt="Copy" width="23" height="23">
            </button>
              <!-- <span class="tooltip"data-copyMsg></span> -->
        </div>
        <div class="input-container">
            <!-- password length selection -->
             <div class="length-selector">
                <p>Password Length</p>
                <p data-lengthValue>0</p>
             </div>

             <!-- slider -->
              <input type="range" min="0" max="20" step="1" class="slider" data-lengthSlider>

              <!-- checkboxes -->
               <div class="check">
                    <input type="checkbox" id="uppercase" >
                    <label for="uppercase">Include Uppercase Letters</label>
               </div>
               <div class="check">
                    <input type="checkbox" id="lowercase" >
                    <label for="lowercase">Include Lowercase Letters</label>
               </div>
               <div class="check">
                    <input type="checkbox" id="numbers" >
                    <label for="numbers">Include Numbers</label>
               </div>
               <div class="check" >
                    <input type="checkbox" id="symbols" >
                    <label for="symbols">Include Symbols</label>
               </div>

               <!-- strength section -->
                <div class="strength-container">
                    <p>Strength</p>
                    <div class="indicator" data-indicator>
                    </div>
                </div>

                <!-- generate button -->
                 <button class="generate-btn" data-generateBtn>Generate Password</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
